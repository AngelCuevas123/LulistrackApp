name: lulistrack_app
description: "A new Flutter project for Lulistrack."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.13.7 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  url_launcher: ^6.2.5
  image_picker: ^1.0.7
  supabase_flutter: ^2.18.3
  flutter_dotenv: ^5.2.1
  sqflite: ^2.4.6
  path_provider: ^2.1.6
  path: ^1.9.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  connectivity_plus: ^6.1.4
  geolocator: ^14.0.2
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/icon/lulistrack_icon.png
    - assets/images/
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/lulistrack_icon.png"
  adaptive_icon_background: "#213A81"
  adaptive_icon_foreground: "assets/icon/lulistrack_icon.png"
